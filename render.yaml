# Render deployment for the API (Phase 14.5, the free-tier path).
#
# Render Dashboard → New → Blueprint → this repository. Render creates the
# service from this file and asks for the values marked `sync: false`, which
# are the secrets: they live in Render's environment store, never here and
# never in a .env on a server.
#
# What this costs: nothing. The `free` plan is a 512 MB instance that sleeps
# after fifteen idle minutes and takes about a minute to wake (Render shows a
# loading page while it does). The API was measured under a hard 512 MB limit
# before this file was written: 123 MB idle, 214 MB after four uncached
# answers — see backend/Dockerfile. There is no free worker process, so the
# API drains its own webhook queue (WEBHOOK_DRAIN_INTERVAL_SECONDS) and the
# nightly and weekly jobs run from GitHub Actions (.github/workflows/jobs.yml).
#
# Deploys are triggered by the pipeline (.github/workflows/deploy.yml) through
# a deploy hook, after CI is green and migrations have run — not on every
# push. For the very first deploy, Dashboard → Manual Deploy works too.

services:
  - type: web
    name: clinicalcontext-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    # maxShutdownDelaySeconds is not settable on the free plan — Render
    # fixes it at its own default (30s) and rejects the blueprint if this
    # key is present at all. GRACEFUL_SHUTDOWN_SECONDS below is set well
    # under that, so uvicorn finishes draining on its own before Render's
    # SIGKILL lands, instead of a streamed answer being cut mid-way. On a
    # paid plan this can be raised (Render then allows the field too).
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Offline is the free tier: the local embedder and reranker and the
      # deterministic reasoner, no paid model calls. Cloud needs Cohere and
      # Anthropic keys and a corpus re-embedded with Cohere (docs/FIRST-DEPLOY.md).
      - key: AI_BACKEND
        value: offline
      # The image carries no speech engine (it would not fit in 512 MB), so
      # voice always goes to Deepgram: one free account covers hearing and
      # speaking, and its key is DEEPGRAM_API_KEY below (docs/DEPLOY.md,
      # Part 4). Without a key, voice in the chat says so and stays off.
      # This is set here, not in the dashboard, because Render re-applies
      # every value in this file whenever the Blueprint syncs: a dashboard
      # "cloud" was reset to this file's "offline" by the first sync after it.
      - key: VOICE_BACKEND
        value: cloud
      - key: OTEL_SERVICE_NAME
        value: clinicalcontext-api
      # The frontend's origin — the only origin a browser may call this API
      # from. Exact scheme and host, no trailing slash.
      - key: CORS_ORIGINS
        value: https://clinicalcontext-euev.vercel.app
      - key: APP_PUBLIC_URL
        value: https://clinicalcontext-euev.vercel.app
      # Small pool per instance; the free tier is one instance.
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "5"
      # Under Render free's fixed 30s shutdown window (see the note above),
      # not the 60s used on a host that lets this be configured.
      - key: GRACEFUL_SHUTDOWN_SECONDS
        value: "25"
      # No worker process on the free tier: the API drains webhooks itself.
      - key: WEBHOOK_DRAIN_INTERVAL_SECONDS
        value: "60"

      # ---- Secrets: entered in the Render dashboard, never in this file ----
      # The transaction-pooler URL (port 6543); the app detects it and turns
      # off asyncpg's statement cache. Migrations use the direct URL and run
      # from the pipeline, not from here.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Required at boot even when AI_BACKEND / VOICE_BACKEND are offline:
      # the configuration validates as a whole. "placeholder" is a fine value
      # for a key that is never called.
      - key: COHERE_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      # Optional, free, no card: a language model to write chat answers
      # (docs/DEPLOY.md, Part 5). Unset, answers are quoted from the sources.
      # Cerebras is a second free quota the chat falls back to when Groq's
      # per-minute limit is reached.
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      # Optional and off when absent — add SENTRY_DSN, LANGSMITH_API_KEY (a
      # real one) or OTEL_EXPORTER_OTLP_ENDPOINT in the dashboard when wanted.
