[project]
name = "clinicalcontext-backend"
version = "0.1.0"
description = "ClinicalContext AI backend — evidence-grounded clinical question answering."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    # Multipart parsing for the private-document upload endpoint (FastAPI
    # requires it for any Form/File parameter).
    "python-multipart>=0.0.20",
    "pyjwt[crypto]>=2.9.0",
    "email-validator>=2.2.0",
    "cohere>=5.13.0",
    "anthropic>=0.40.0",
    "arq>=0.26.0",
    "pdfplumber>=0.11.0",
    "pgvector>=0.3.0",
    "numpy>=2.1.0",
    "langgraph>=0.2.60",
    "langsmith>=0.2.0",
    "presidio-analyzer>=2.2.355",
    "spacy>=3.8.0,<3.9.0",
    # The spaCy model pinned as a tracked dependency (not `spacy download`),
    # so Presidio's NER layer installs deterministically in CI and locally.
    # Lightweight (~12MB); the regex layer carries the non-negotiable gate.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Phase 11 voice: fuzzy medical-term correction (rapidfuzz) and the
    # WebSocket clients for Deepgram / ElevenLabs streaming (websockets).
    "rapidfuzz>=3.10.0",
    "websockets>=13.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "sentry-sdk[fastapi]>=2.19",
]

[dependency-groups]
# The offline voice backend: faster-whisper for STT and, on Windows, the
# OneCore speech synthesizer (WinRT) for TTS. Real engines, no accounts —
# `uv sync --group voice` (Linux CI uses espeak-ng for TTS instead).
voice = [
    "faster-whisper>=1.1.0",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Core>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.SpeechSynthesis>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "asyncpg-stubs>=0.30.0",
    "reportlab>=4.2.0",
    "locust>=2.32",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Realistic XML fixtures keep their natural line lengths.
"tests/test_pubmed_parser.py" = ["E501"]
"tests/test_pmc_parser.py" = ["E501"]
# Adversarial cases are natural-language clinical queries — their length is data.
"evals/adversarial/build_cases.py" = ["E501"]
# Voice fixtures are spoken clinical questions — their length is data too.
"evals/voice/manifest.py" = ["E501"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pdfplumber.*",
    "pgvector.*",
    "presidio_analyzer.*",
    "spacy.*",
    "langgraph.*",
    "langsmith.*",
    "langchain_core.*",
    "faster_whisper.*",
    "winrt.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
